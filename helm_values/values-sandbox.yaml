# The yarilo stand: yarilo-postfix's MySQL table dkim, private keys as Vault
# Transit ciphertext in private_key_enc, Vault in namespace vault over TLS
# from the stand's internal CA (seconddns/k8s_vault). Installed with helm
# upgrade in yarilo-relay; the DSN Secret is made once from yarilo-mysql (README).
# The stand runs what develop built last.
image:
  repository: ghcr.io/yarilomail/dkim-milter
  tag: "develop"
  pullPolicy: Always

db:
  driver: mysql
  dsnSecret:
    name: dkim-milter-db
    key: DB_DSN

keyDecrypt: vault

vault:
  addr: "https://vault.vault.svc:8200"
  role: dkim-milter
  caCertSecret: dkim-milter-vault-ca
  caCertificate:
    issuerRef:
      name: yarilo-internal-ca
      kind: Issuer

# The stand's Calico enforces it; only relay-mta runs the milter (relay-fwd
# signs nothing: yarilo-postfix 0.1.8 drops it from that chain).
networkPolicy:
  enabled: true
  postfix:
    podSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [relay-mta]
