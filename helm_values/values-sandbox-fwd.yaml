# The stand's second release, dkim-milter-fwd, for relay-fwd's submission
# listener (587): only yarilo's technical account logs in there. Its own
# mail (vacation, notify, reports) is signed with its From domain's key, a
# redirect with the forwarder's. On top of values-sandbox.yaml:
#   helm upgrade --install dkim-milter-fwd helm -n yarilo-relay \
#     -f helm_values/values-sandbox.yaml -f helm_values/values-sandbox-fwd.yaml
signAuth: any

# Forwarded mail (a Sieve redirect) is signed d=fwd.d00001.test, yarilo's own
# mail with its From domain's key.
signDomain: fwd.d00001.test

# relay-fwd-out signs; relay-fwd's Received is the one hop before it. It also
# holds with relay-fwd signing: yarilo's own mail brings 0, a redirect 3 or 4.
signHopsBefore: 1

vault:
  # A Secret of this release's own: two releases cannot own one Certificate.
  caCertSecret: dkim-milter-fwd-vault-ca

networkPolicy:
  postfix:
    podSelector:
      matchExpressions: null
      matchLabels:
        app: relay-fwd
