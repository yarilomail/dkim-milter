# The stand's second release, dkim-milter-fwd, for relay-fwd's submission
# listener (587): only yarilo's technical account logs in there, so every
# authenticated message is yarilo's own (vacation, notify, reports) and is
# signed with its From domain's key. On top of values-sandbox.yaml:
#   helm upgrade --install dkim-milter-fwd helm -n yarilo-relay \
#     -f helm_values/values-sandbox.yaml -f helm_values/values-sandbox-fwd.yaml
signAuth: any

vault:
  # A Secret of this release's own: two releases cannot own one Certificate.
  caCertSecret: dkim-milter-fwd-vault-ca

networkPolicy:
  postfix:
    podSelector:
      matchExpressions: null
      matchLabels:
        app: relay-fwd
