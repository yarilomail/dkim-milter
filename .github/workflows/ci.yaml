name: CI dkim-milter

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:
  # No path filter: Lint and Test are required checks, so every PR must get them.
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dkim-milter
  DOCKERHUB_IMAGE: docker.io/0kaba0/dkim-milter
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go/go.mod
          cache-dependency-path: app/go/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        working-directory: app/go
        run: golangci-lint run ./...

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: app/go/Dockerfile

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go/go.mod
          cache-dependency-path: app/go/go.sum

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Run tests
        working-directory: app/go
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | go-junit-report -set-exit-code > /tmp/test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Go Tests
          path: /tmp/test-results.xml
          reporter: java-junit

  build:
    name: Build & Push
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-24.04
    concurrency:
      group: build-main-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, ""); print $2}' helm/Chart.yaml)
          RELEASE_TAG="v${APP_VERSION}"
          # Releases come from main only; develop builds carry the -dev.N version as a tag.
          IS_RELEASE=false
          if [ "${GITHUB_REF_NAME}" = main ] && ! git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q "${RELEASE_TAG}"; then
            IS_RELEASE=true
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub keeps releases and latest only; develop pushes to GHCR alone.
      - name: Log in to Docker Hub
        if: github.ref_name == 'main'
        uses: docker/login-action@v4.7.0
        with:
          registry: docker.io
          username: 0kaba0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=${{ steps.version.outputs.app_version }},enable=${{ github.ref_name == 'develop' }}
            type=raw,value=${{ steps.version.outputs.app_version }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Extract metadata (Docker Hub)
        id: meta_hub
        if: github.ref_name == 'main'
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.app_version }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: app/go
          file: app/go/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN may not push a ref whose range touches .github/workflows,
          # and that scope cannot be granted to it. Let the release API create the
          # tag instead: it points at a commit that already exists.
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

      - name: Update Docker Hub description
        if: github.ref_name == 'main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: 0kaba0
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: 0kaba0/dkim-milter
          readme-filepath: README.md

      - name: Cleanup old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: dkim-milter
          package-type: container
          min-versions-to-keep: 10
          token: ${{ secrets.GHCR_DELETE_TOKEN }}
